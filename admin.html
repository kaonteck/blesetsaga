<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e0f12">
<title>블레셋 전기 · 운영</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap">
<style>
/* 운영 페이지 전용 스타일 (백엔드 담당). 게임 css/style.css 와 색만 맞추고 따로 둔다. */
:root{
  --void:#0e0f12;--night:#121317;--slab:#17181c;--slab-2:#1d1e23;--slab-3:#25262c;--rule:#26272d;--rule-2:#373940;
  --text:#d3d1dc;--muted:#8e8e99;--faint:#62636c;--silver:#f3efe6;--gold:#b3a27e;--gold-hi:#d6cbb0;
  --ok:#72c096;--warn:#d9a65c;--bad:#e27f7f;--violet:#6fa9e6;--violet-lo:#2b4566;
  --f-sys:system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-display:'Nanum Myeongjo',Georgia,serif;
  --f-code:ui-monospace,'SF Mono',Menlo,Consolas,'D2Coding',monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--text);font:14px/1.5 var(--f-sys)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet)}
.hide{display:none!important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1400px;margin:0 auto}
.brand{font-family:var(--f-display);font-size:17px;color:var(--silver);white-space:nowrap}
.brand small{font-family:var(--f-sys);font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:.08em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:7px 11px;border-radius:var(--r);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--slab-2)}
.tab[aria-selected=true]{color:var(--silver);background:var(--slab-3)}
.tab .num{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--bad);color:#1b0e0e;font-size:11px;font-weight:600;text-align:center}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;white-space:nowrap}

.wrap{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--slab);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--gold-hi);display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

/* 버튼·입력 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--rule-2);background:var(--slab-2);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--slab-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn-p{background:var(--gold);border-color:var(--gold);color:#17140d;font-weight:600}
.btn-p:hover{background:var(--gold-hi)}
.btn-d{color:var(--bad);border-color:#5a2f31}
.btn-g{background:none;border-color:transparent;color:var(--muted)}
.btn-g:hover{color:var(--text);background:var(--slab-2)}
.btn-sm{padding:4px 9px;font-size:12.5px}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=datetime-local],select,textarea{
  background:var(--night);border:1px solid var(--rule-2);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet-lo);border-color:var(--violet)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
textarea.code{font:12.5px/1.55 var(--f-code);tab-size:2;white-space:pre;resize:vertical;min-height:320px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}

/* 칩 */
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--rule-2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#2f5240}.chip.warn{color:var(--warn);border-color:#5b4523}
.chip.bad{color:var(--bad);border-color:#5a2f31}.chip.info{color:var(--violet);border-color:var(--violet-lo)}
.chip.dim{color:var(--faint)}

/* 콘텐츠 탭: 종류 | 목록 | 편집기 */
.cgrid{display:grid;grid-template-columns:170px 300px 1fr;gap:12px;align-items:start}
.kinds{display:flex;flex-direction:column;gap:2px}
.kind{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);background:none;border:0;cursor:pointer;color:var(--muted);text-align:left}
.kind:hover{background:var(--slab-2);color:var(--text)}
.kind[aria-current=true]{background:var(--slab-3);color:var(--silver)}
.kind .n{font-size:11.5px;color:var(--faint)}
.list{display:flex;flex-direction:column;max-height:calc(100vh - 220px);overflow:auto;margin:0 -14px;border-top:1px solid var(--rule)}
.li{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--rule);cursor:pointer}
.li:hover{background:var(--slab-2)}
.li[aria-current=true]{background:var(--slab-3)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{display:block;color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chips{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ed-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.ed-head h2{margin:0;font-family:var(--f-display);font-size:19px;color:var(--silver);font-weight:700}
.ed-head .id{font-size:12px;color:var(--faint)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.sets{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ed-grid>*{min-width:0}
.sets .wide{grid-column:1/-1}
.msg{padding:9px 11px;border-radius:var(--r);font-size:12.5px;line-height:1.55}
.msg.bad{background:#2a1617;color:#f0b3b3;border:1px solid #5a2f31}
.msg.ok{background:#14241b;color:#a9dcbf;border:1px solid #2f5240}
.msg.warn{background:#2a2112;color:#ecc98f;border:1px solid #5b4523}
.msg.info{background:#131c27;color:#b9d7f5;border:1px solid var(--violet-lo)}
.msg ul{margin:4px 0 0;padding-left:18px}
.hist{display:flex;flex-direction:column;gap:0;max-height:420px;overflow:auto;margin:0 -14px}
.hi{padding:8px 14px;border-top:1px solid var(--rule);font-size:12.5px}
.hi .row{justify-content:space-between}
.diff{font:11.5px/1.5 var(--f-code);color:var(--muted);margin-top:4px;word-break:break-all}
.diff b{color:var(--gold-hi);font-weight:500}
.diff .a{color:var(--ok)}.diff .r{color:var(--bad);text-decoration:line-through}
.back{display:none}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:hover td{background:var(--slab-2)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}

/* 팝업·알림 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--slab);border:1px solid var(--rule-2);border-radius:8px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.modal h3{margin:0 0 12px;font-size:15px;color:var(--silver)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--slab-3);border:1px solid var(--rule-2);padding:9px 14px;border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:13px}
.toast.good{border-color:#2f5240;color:#a9dcbf}.toast.bad{border-color:#5a2f31;color:#f0b3b3}

.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{font-family:var(--f-display);font-weight:700;color:var(--silver);font-size:24px;text-align:center;margin:0 0 4px}
.login p.sub{text-align:center;color:var(--gold);font-size:12px;letter-spacing:.1em;margin:0 0 20px}
.empty{color:var(--faint);text-align:center;padding:24px 8px;font-size:13px}
.loading{color:var(--faint);padding:40px 0;text-align:center}
pre.json{font:12px/1.5 var(--f-code);background:var(--night);border:1px solid var(--rule);border-radius:var(--r);padding:10px;max-height:60vh;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}

/* 휴대폰: 한 번에 한 칸씩 */
@media (max-width:1100px){.cgrid{grid-template-columns:150px 1fr}.cgrid .ed{grid-column:1/-1}.ed-grid{grid-template-columns:1fr}}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;gap:8px;padding:8px 12px}.tabs{order:3;flex-basis:100%}
  .wrap{padding:12px}
  .cgrid{grid-template-columns:1fr}
  .cgrid.pick-list .kinds-p,.cgrid.pick-ed .kinds-p,.cgrid.pick-ed .list-p{display:none}
  .cgrid.pick-kind .list-p,.cgrid.pick-kind .ed,.cgrid.pick-list .ed{display:none}
  .back{display:inline-flex}
  .list{max-height:none}
  .two,.sets{grid-template-columns:1fr}
  textarea.code{min-height:50vh}
}

/* 콘텐츠 양식 편집기 (a6-forms.js) */
.monimg-pv{width:120px;height:120px;flex:none;border:1px solid var(--rule,#333);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#0b0d12;overflow:hidden}
.monimg-pv img{max-width:100%;max-height:100%;object-fit:contain}
.fm{display:flex;flex-direction:column;gap:10px}
.fm-sec{background:var(--slab-2);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.fm-sec h4{margin:0 0 10px;font-size:13px;color:var(--gold-hi);font-weight:600;display:flex;align-items:center;gap:6px}
.fm-sec.scene.battle{border-left:3px solid var(--bad)}.fm-sec.scene.end{border-left:3px solid var(--ok)}
.sc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.sc-h h4{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:start}
.fgrid .wide,.fm .f.wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.f .fl{font-size:12px;color:var(--muted)}
.f small{font-size:11px}
.f textarea{resize:vertical;font:13px/1.5 var(--f-sys)}
textarea.code.sm{min-height:0;font-size:12px}
.f input.bad,.f textarea.bad{border-color:var(--bad)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.sg{padding:5px 11px;border-radius:999px;border:1px solid var(--rule-2);background:var(--night);color:var(--muted);cursor:pointer;font-size:12.5px}
.sg:hover{color:var(--text)}.sg[aria-checked=true]{background:var(--gold);border-color:var(--gold);color:#17140d;font-weight:600}
.cb{position:relative}.cb-id{font-size:11px;margin-left:2px}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:30;max-height:260px;overflow:auto;background:var(--slab);border:1px solid var(--rule-2);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.cb-o{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:6px 10px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer;color:var(--text)}
.cb-o b{font-weight:500;font-size:13px}.cb-o small{font-size:11px}
.cb-o:hover,.cb-o.hi{background:var(--slab-3)}
.tg{border:1px dashed var(--rule-2);border-radius:var(--r);padding:7px 10px}.tg.on{border-style:solid;background:var(--slab)}
.tg-h{font-weight:600;color:var(--text)}.tg-b{margin-top:8px}
.chs{display:flex;flex-direction:column;gap:8px;margin:10px 0 8px}
.ch{border:1px solid var(--rule);border-radius:var(--r);padding:10px;background:var(--slab)}
.ch-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ch-h b{font-size:12.5px;color:var(--silver)}.ch-h .btn{margin-left:auto}
.ir{margin-bottom:4px}.nsm{width:80px!important;flex:none}
.chip .x{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px}
.mon-info{margin:0;padding:6px 8px;background:var(--night);border-radius:var(--r)}
.codebox{border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px;background:var(--slab-2)}
.codebox summary{cursor:pointer;font-size:12.5px;color:var(--gold-hi)}
.codebox textarea.code{margin-top:8px;min-height:240px}
@media (max-width:720px){.fgrid{grid-template-columns:1fr}}

/* ═════ 운영 페이지 보기 쉽게 (프론트, 2026-11-05) ═════
   ① 지금 마크업에 바로 적용되는 부분 */
/* 콘텐츠 종류: 왼쪽 칸 → 위쪽 알약 줄 (넓은 화면) */
@media (min-width:1101px){
  .cgrid{grid-template-columns:290px minmax(0,1fr);grid-template-areas:"k k" "l e"}
  .cgrid>.kinds-p{grid-area:k;display:flex;align-items:center;gap:12px;padding:8px 10px}
  .cgrid>.list-p{grid-area:l}.cgrid>.ed{grid-area:e}
  .kinds-p>h3{display:none}
  .kinds-p .kinds{flex-direction:row;flex-wrap:wrap;gap:4px;flex:1}
  .kinds-p .kind{padding:7px 12px;border-radius:999px;gap:6px}
  .kinds-p .kind[aria-current=true]{background:var(--gold);color:#17140d;font-weight:600}
  .kinds-p .kind[aria-current=true] .n{color:#4a3f26}
  .kinds-p>.stack{flex-direction:row!important;margin:0!important;border:0!important;padding:0!important;gap:4px}
  .kinds-p>.stack .btn{background:none;border-color:transparent;color:var(--muted)}
  .kinds-p>.stack .btn:hover{color:var(--text);background:var(--slab-2)}
  .ed-grid{grid-template-columns:minmax(0,1fr) 260px}
  .list{max-height:calc(100vh - 250px)}
}
/* 편집 칸: 넓은 화면은 3칸 */
@media (min-width:1280px){.fm>.fm-sec:not(.scene)>.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* 공개하기·초안 저장·검사 줄: 긴 양식을 내려도 화면 아래에 붙어 있음 */
.ed .stack>.row:has(>#c-pub){position:sticky;bottom:0;z-index:4;background:var(--slab);margin:0 -14px;padding:10px 14px;border-top:1px solid var(--rule);box-shadow:0 -10px 18px -12px rgba(0,0,0,.6)}
/* 이름표·편집 칸 글자 조금 크게, 표 줄 여유 */
.f,.f .fl{font-size:12.5px;color:var(--text)}
.fm-sec h4{font-size:13.5px;color:var(--silver)}
.tbl td{padding:10px 8px;vertical-align:middle}
.tbl th{background:var(--slab-2);padding:9px 8px}
.panel h3{font-size:13.5px;color:var(--silver)}

/* ② 새 마크업용 (백엔드가 구조를 바꾸면 적용 — docs/admin-redesign.md) */
/* 왼쪽 메뉴 */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--night);border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:14px;padding:16px 10px}
.side-brand{font-family:var(--f-display);font-size:17px;color:var(--silver);padding:2px 10px 6px}
.side-brand small{display:block;font-family:var(--f-sys);font-size:11px;color:var(--gold);letter-spacing:.08em;margin-top:2px}
.side-nav{display:flex;flex-direction:column;gap:14px}
.nav-g{display:flex;flex-direction:column;gap:1px}
.nav-gl{font-size:11px;color:var(--faint);padding:0 10px 4px;letter-spacing:.04em}
.side .tab{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13.5px;text-align:left}
.side .tab svg{width:16px;height:16px;flex:none;opacity:.8}
.side .tab[aria-selected=true]{background:var(--slab-3);color:var(--silver)}
.side .tab[aria-selected=true] svg{opacity:1;color:var(--gold-hi)}
.side .tab .num{margin-left:auto}
.side-me{margin-top:auto;border-top:1px solid var(--rule);padding:12px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.shell .wrap{max-width:1320px;margin:0;padding:20px 24px;width:100%}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;z-index:20;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side-brand{padding:0;font-size:15px;white-space:nowrap}.side-brand small{display:none}
  .side-nav,.nav-g{flex-direction:row;gap:2px}
  .nav-gl{display:none}
  .side .tab{width:auto;white-space:nowrap;padding:7px 10px}.side .tab svg{display:none}
  .side-me{margin:0;border:0;padding:0;flex-direction:row;align-items:center;white-space:nowrap}
  .shell .wrap{padding:12px}
}
/* 화면 제목 */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;color:var(--silver);font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ph-act{display:flex;gap:6px;align-items:center}
/* 홈 */
.dash-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.dash-card{background:var(--slab);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;color:inherit}
.dash-card:hover{border-color:var(--rule-2)}
.dash-card small{color:var(--muted);font-size:12.5px}
.dash-card b{font-size:28px;color:var(--silver);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.dash-card em{font-style:normal;font-size:12px;color:var(--faint)}
.dash-card.alert{border-color:#5a2f31}.dash-card.alert b{color:var(--bad)}
.dash-card.ok b{color:var(--ok)}
.dash-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
.todo{display:flex;flex-direction:column}
.todo-i{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.todo-i:first-child{border-top:0}
.todo-i .t{flex:1;min-width:0}.todo-i .t b{display:block;font-weight:500}.todo-i .t small{color:var(--faint);font-size:12px}
.todo-i .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.todo-i .dot.bad{background:var(--bad)}.todo-i .dot.warn{background:var(--warn)}
@media (max-width:900px){.dash-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-two{grid-template-columns:1fr}}

.ed-head.stick{position:sticky;top:0;z-index:5;background:var(--slab);margin:-14px -14px 12px;padding:12px 14px;border-bottom:1px solid var(--rule);border-radius:var(--r) var(--r) 0 0;align-items:center}

.ed-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* 이름표: 한글 + 작은 회색 영문 키 */
.f .key{font:10.5px var(--f-code);color:var(--faint);margin-left:5px}
.fm-sec h4 i{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:400}
/* 퀘스트: 장면 접기 + 흐름 */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:10px 14px;background:var(--night);border:1px solid var(--rule);border-radius:10px}
.flow .n{padding:3px 9px;border-radius:999px;border:1px solid var(--rule-2);color:var(--text);background:none;cursor:pointer;font:inherit}
.flow .n.b{border-color:#5a2f31;color:var(--bad)}.flow .n.e{border-color:#2f5240;color:var(--ok)}
.scn{border:1px solid var(--rule);border-radius:10px;background:var(--slab-2);overflow:hidden}
.scn>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.scn>summary::-webkit-details-marker{display:none}
.scn>summary::before{content:"›";color:var(--faint);font-size:16px;width:10px;transition:transform .15s}
.scn[open]>summary::before{transform:rotate(90deg)}
.scn>summary b{color:var(--silver);font-weight:600;min-width:60px}
.scn>summary .s{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn>summary .to{font-size:12px;color:var(--faint);white-space:nowrap}
.scn.battle{border-left:3px solid var(--bad)}.scn.end{border-left:3px solid var(--ok)}
.scn>.fm-sec{border:0;border-top:1px solid var(--rule);border-radius:0;margin:0}
.scn>.fm-sec.scene.battle,.scn>.fm-sec.scene.end{border-left:0}
/* 몬스터 · 만신전 패턴 표 */
.fm .pt{width:100%;border-collapse:collapse;font-size:12.5px}
.cpg{display:grid;grid-template-columns:repeat(var(--n),26px);gap:2px;width:max-content;max-width:100%;overflow:auto;padding:6px;background:#0b0d12;border:1px solid var(--rule);border-radius:6px}
.cpc{width:26px;height:26px;border:1px solid rgba(255,255,255,.12);border-radius:3px;background:#1a1d24;cursor:pointer;padding:0;font-size:12px;color:#ffd27a;line-height:1}
.cpc:hover{border-color:rgba(255,255,255,.35)}
.cpc.on{background:#c0392b;border-color:#e46a5c}
.cpc.boss{background:#5a2a2a;border-color:transparent;cursor:default}
.cpc.tg{outline:2px solid #ffd27a;outline-offset:-2px}
.cp-wrap .seg button{background:transparent;border:1px solid var(--rule);color:inherit;padding:3px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:12px}
.cp-wrap .seg button.on{background:var(--accent,#c9a46a);color:#111}
details.cp>summary{cursor:pointer;list-style:none}
.fm .pt th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--rule)}
.fm .pt td{padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.fm .pt td:first-child{min-width:150px}.fm .pt td:first-child small{display:block;font-size:11px;line-height:1.35}
.fm .pt input{width:100%}.fm .pt td:nth-child(3){width:84px}
@media(max-width:760px){.fm .pt thead{display:none}.fm .pt tr{display:grid;grid-template-columns:1fr 84px;gap:4px;padding:6px 0;border-bottom:1px solid var(--rule)}.fm .pt td{border:0;padding:0}.fm .pt td:first-child{grid-column:1/-1}.fm .pt td:last-child{grid-column:1/-1}}
/* 양식 고르기 버튼 한 줄 (분류·종류 등) */
.fm .seg{flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}.fm .seg::-webkit-scrollbar{display:none}
.fm .sg{white-space:nowrap;flex:none;padding:5px 10px}
@media (min-width:1280px){.fm>.fm-sec:not(.scene)>.fgrid>.f:has(>.seg>.sg:nth-child(4)){grid-column:span 2}}
